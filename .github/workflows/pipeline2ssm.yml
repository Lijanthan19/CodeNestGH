name: Pipeline 2 CodeNest Deploy using SSM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # DEPLOY STAGE
  # ==========================================

  deploy:
    name: Deploy CodeNest to EC2 using SSM

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================
      # AWS AUTHENTICATION
      # ==========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1


      # ==========================================
      # CHECK AWS IDENTITY
      # ==========================================

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity


      # ==========================================
      # FIND CODE NEST EC2 INSTANCE DYNAMICALLY
      # ==========================================

      - name: Find CodeNest EC2 Instance
        shell: bash
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=CodeNest-Server" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: CodeNest EC2 instance not found."
            exit 1
          fi

          echo "Found CodeNest EC2 Instance: $INSTANCE_ID"

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"


      # ==========================================
      # DEPLOY USING SSM
      # ==========================================

      - name: Deploy CodeNest using SSM
        shell: bash
        run: |

          echo "Deploying to EC2 Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CodeNest application using SSM" \
            --parameters 'commands=[
              "docker pull ghcr.io/lijanthan19/codenestgh:latest",
              "docker stop codenest || true",
              "docker rm codenest || true",
              "docker run -d --name codenest -p 50050:50050 ghcr.io/lijanthan19/codenestgh:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Deployment Result:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json


      # ==========================================
      # APPLICATION HEALTH CHECK
      # ==========================================

      - name: Check CodeNest Application
        shell: bash
        run: |

          echo "Running health check on EC2 Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Check CodeNest application health" \
            --parameters 'commands=[
              "echo === Docker Container Status ===",
              "docker ps -a",
              "echo === Docker Logs ===",
              "docker logs codenest --tail 50",
              "echo === Application Health Check ===",
              "curl -f http://localhost:50050 || exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Health Check Command ID: $COMMAND_ID"

          echo "Waiting for health check..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Health Check Result:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json