name: Pipeline 1 CodeNest Build, Push and Deploy using AWS CLI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD STAGE
  # ==========================================

  build:
    name: Build Java Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codenest-jar
          path: target/*.jar


  # ==========================================
  # DOCKER STAGE
  # ==========================================

  docker:
    name: Build and Push Docker Image

    needs: build

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: codenest-jar
          path: target

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/lijanthan19/codenestgh:latest .

      - name: Push Docker Image to GHCR
        run: |
          docker push \
            ghcr.io/lijanthan19/codenestgh:latest


  # ==========================================
  # DEPLOY STAGE
  # ==========================================

  deploy:
    name: Deploy to EC2

    needs: docker

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================
      # AWS AUTHENTICATION
      # ==========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1


      # ==========================================
      # VERIFY AWS AUTHENTICATION
      # ==========================================

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity


      # ==========================================
      # FIND CODE NEST EC2 INSTANCE
      # ==========================================

      - name: Get CodeNest EC2 Instance ID
        shell: bash
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=CodeNest-Server" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: CodeNest EC2 instance was not found or is not running."
            exit 1
          fi

          echo "CodeNest EC2 Instance ID: $INSTANCE_ID"

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"


      # ==========================================
      # DEPLOY DOCKER CONTAINER
      # ==========================================

      - name: Deploy CodeNest to EC2 using SSM
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CodeNest application" \
            --parameters 'commands=[
              "docker pull ghcr.io/lijanthan19/codenestgh:latest",
              "docker stop codenest || true",
              "docker rm codenest || true",
              "docker run -d --name codenest -p 50050:50050 ghcr.io/lijanthan19/codenestgh:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 to execute the command..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Getting deployment result..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json


      # ==========================================
      # CHECK APPLICATION
      # ==========================================

      - name: Check Application
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Check CodeNest application" \
            --parameters 'commands=[
              "echo === Docker Container Status ===",
              "docker ps -a",
              "echo === Docker Logs ===",
              "docker logs codenest --tail 50",
              "echo === Application Health Check ===",
              "curl -f http://localhost:50050 || exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Application Check Command ID: $COMMAND_ID"

          echo "Waiting for application health check..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Application Check Result:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json 