name: CodeNest Build, Push and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD STAGE
  # ==========================================

  build:
    name: Build Java Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codenest-jar
          path: target/*.jar


  # ==========================================
  # DOCKER STAGE
  # ==========================================

  docker:
    name: Build and Push Docker Image

    needs: build

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: codenest-jar
          path: target

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/lijanthan19/codenestgh:latest .

      - name: Push Docker Image to GHCR
        run: |
          docker push \
            ghcr.io/lijanthan19/codenestgh:latest


  # ==========================================
  # DEPLOY STAGE
  # ==========================================

  deploy:
    name: Deploy to EC2

    needs: docker

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================
      # AWS AUTHENTICATION
      # ==========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      # ==========================================
      # VERIFY AWS AUTHENTICATION
      # ==========================================

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ==========================================
      # DEPLOY DOCKER CONTAINER
      # ==========================================

      - name: Deploy CodeNest to EC2 using SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-028c25eff8c7497dd" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CodeNest application" \
            --parameters 'commands=[
              "docker pull ghcr.io/lijanthan19/codenestgh:latest",
              "docker stop codenest || true",
              "docker rm codenest || true",
              "docker run -d --name codenest -p 50050:50050 ghcr.io/lijanthan19/codenestgh:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 to execute the command..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-028c25eff8c7497dd"

          echo "Getting deployment result..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-028c25eff8c7497dd" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      # ==========================================
      # CHECK APPLICATION
      # ==========================================

      - name: Check Application
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-028c25eff8c7497dd" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker ps -a",
              "docker logs codenest --tail 50",
              "curl -I http://localhost:50050 || true"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Application Check Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-028c25eff8c7497dd"

          echo "Application Check Result:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-028c25eff8c7497dd" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json