name: CodeNest Build, Push and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD STAGE
  # ==========================================

  build:
    name: Build Java Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codenest-jar
          path: target/*.jar


  # ==========================================
  # DOCKER STAGE
  # ==========================================

  docker:
    name: Build and Push Docker Image

    needs: build

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: codenest-jar
          path: target

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/lijanthan19/codenestgh:latest .

      - name: Push Docker Image to GHCR
        run: |
          docker push \
            ghcr.io/lijanthan19/codenestgh:latest


  # ==========================================
  # DEPLOY STAGE
  # ==========================================

  deploy:
    name: Deploy to EC2

    needs: docker

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Check AWS Role ARN
        run: |
          echo "AWS Role ARN is configured: ${{ vars.AWS_ROLE_ARN != '' }}"
          echo "Repository: ${{ github.repository }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsCodeNest

      - name: Check GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity