name: CodeNest Build, Push and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD STAGE
  # ==========================================

  build:
    name: Build Java Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codenest-jar
          path: target/*.jar


  # ==========================================
  # DOCKER STAGE
  # ==========================================

  docker:
    name: Build and Push Docker Image

    needs: build

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: codenest-jar
          path: target

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/lijanthan19/codenestgh:latest .

      - name: Push Docker Image to GHCR
        run: |
          docker push \
            ghcr.io/lijanthan19/codenestgh:latest


  # ==========================================
  # DEPLOY STAGE
  # ==========================================

  deploy:
    name: Deploy to EC2

    needs: docker

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Deploy CodeNest to EC2 using SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-028c25eff8c7497dd" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CodeNest application" \
            --parameters 'commands=[
              "docker pull ghcr.io/lijanthan19/codenestgh:latest",
              "docker stop codenest || true",
              "docker rm codenest || true",
              "docker run -d --name codenest -p 50050:50050 ghcr.io/lijanthan19/codenestgh:latest"
            ]' \
            --output text